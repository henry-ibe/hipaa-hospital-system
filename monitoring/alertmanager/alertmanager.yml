global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'region', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1m
  receiver: 'ntfy-bridge'

receivers:
  - name: 'ntfy-bridge'
    webhook_configs:
      - url: 'http://localhost:5001/webhook'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['region', 'hospital']
